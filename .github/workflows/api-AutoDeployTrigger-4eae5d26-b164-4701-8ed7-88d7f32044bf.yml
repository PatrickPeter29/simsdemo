name: Trigger auto deployment for api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/api-AutoDeployTrigger-4eae5d26-b164-4701-8ed7-88d7f32044bf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.API_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.API_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.API_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/SIMSAPI
          dockerfilePath: Dockerfile
          _targetLabelKey_: _targetLabel_
          registryUrl: simsapi.azurecr.io
          registryUsername: ${{ secrets.API_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.API_REGISTRY_PASSWORD }}
          containerAppName: api
          resourceGroup: SIMS
          imageToBuild: simsapi.azurecr.io/api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


